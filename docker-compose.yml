version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linuxpath_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - linuxpath_network

  webserver:
    image: nginx:alpine
    container_name: linuxpath_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - linuxpath_network

  db:
    image: mysql:8.0
    container_name: linuxpath_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-linuxpath}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret_root_password}
      MYSQL_USER: ${DB_USERNAME:-linuxpath}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linuxpath_network

networks:
  linuxpath_network:
    driver: bridge

volumes:
  db_data:
